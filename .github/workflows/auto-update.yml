name: Bot Auto Update Klasemen

on:
  schedule:
    # Berjalan otomatis setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol manual jika ingin update mendadak

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Cek Lokasi File (Debug)
      run: ls -la

    - name: Jalankan Bot Scraper
      run: |
        if [ -f "scraper.js" ]; then
          node scraper.js
        elif [ -f "Scraper.js" ]; then
          node Scraper.js
        else
          echo "Mencari file scraper di sub-folder..."
          node $(find . -name "scraper.js" -o -name "Scraper.js" | head -n 1)
        fi

    - name: Commit dan Push Perubahan Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add *.json || true
        git commit -m "Auto Update Skor Klasemen" || exit 0
        git push
